services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      # SQLite 文件数据库，挂在数据卷里持久化
      DB_URL: ${DB_URL:-jdbc:sqlite:/app/data/hongyan.db}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: Asia/Shanghai
    volumes:
      - data:/app/data
    ports:
      # 只监听本机；宿主机用 18080 避开服务器上其他已占用 8080 的项目
      - "127.0.0.1:18080:8080"

volumes:
  data:

# api.gymesium.cn 是多个项目共用的域名，本文件只接管 /hongyan/ 路径，
# 其他项目的 location 不受影响。建议作为单独的 include 片段放到已有 server 块中。
location /hongyan/ {
    proxy_pass http://127.0.0.1:18080;   # 末尾不带路径，保留 /hongyan 前缀交给 Spring Boot context-path
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

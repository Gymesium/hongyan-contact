server:
  port: 8080
  servlet:
    # 共用域名 api.gymesium.cn 上可能还有其他项目，所以本项目所有接口都加上 /hongyan 前缀
    # 最终对外地址形如 https://api.gymesium.cn/hongyan/api/auth/login
    context-path: /hongyan

spring:
  application:
    name: hongyan-contacts
  datasource:
    # SQLite 文件数据库：hongyan.db 会自动创建在后端工作目录
    url: ${DB_URL:jdbc:sqlite:hongyan.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者，连接池保持 1 个连接最稳妥
      maximum-pool-size: 1
      # SQLite 默认不启用外键约束，每个连接上显式打开（级联删除等依赖它）
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  sql:
    init:
      # SQLite 无独立服务：每次启动执行幂等脚本（create table if not exists / insert or ignore）
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-replace-with-32bytes}
    expire-minutes: 120
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123456}
    real-name: 系统管理员
  cors:
    # 生产环境由 CORS_ORIGINS 注入：https://hongyan.gymesium.top
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
